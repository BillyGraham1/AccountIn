const fmtCountdown = (ms) => {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
};

   `group` drives hint copy, `statement`/`side` decide where it's placed, `sign` decides whether
   it adds to or subtracts from that side's total (contra accounts subtract).
   ============================================================================================ */

const meta = (group, statement, side, sign) => ({ group, statement, side, sign });

  'Barang Jadi': meta('aset', 'neraca', 'kiri', 1),

  'BOP Sesungguhnya': meta('clearing', 'none', null, 1),

};

const GROUP_LABEL = {
  'aset': 'ASET', 'aset-kontra': 'pengurang ASET',
  'liabilitas': 'LIABILITAS', 'ekuitas': 'EKUITAS', 'ekuitas-kontra': 'pengurang EKUITAS',
  'pendapatan': 'PENDAPATAN', 'pendapatan-kontra': 'pengurang PENDAPATAN',
  'beban': 'BEBAN / HARGA POKOK', 'beban-kontra': 'pengurang BEBAN / HARGA POKOK',
};

function explainAccount(account) {
  const m = ACCOUNTS_META[account];
  if (!m) return { soft: '', explicit: '' };
  const label = GROUP_LABEL[m.group] || m.group;
  const columnWord = m.side === 'kiri' ? 'KIRI' : 'KANAN';
  const isContra = m.group.endsWith('kontra');
  const soft = isContra
    ? `"${account}" termasuk ${label}. Ia tetap ditulis di kolom ${columnWord}, tapi nilainya justru MENGURANGI total kolom itu.`
    : `"${account}" termasuk kelompok ${label}, jadi selalu diletakkan di kolom ${columnWord}.`;
  const explicit = `Ambil angkanya langsung dari Neraca Saldo yang sudah kamu isi sebelumnya — jangan dihitung ulang dari awal.`;
  return { soft, explicit };
}

/* ============================================================================================
   DERIVATION ENGINE
   Everything below is computed — not hand-typed — from the transaction bank. That means the
   ledger, trial balance, and financial statement can never drift out of sync with the journal:
   there's exactly one source of truth per level.
   ============================================================================================ */

function buildLevel(bank, n) {
  const txs = bank.slice(0, n);

  let flatIdx = 0;
  const journalGroups = txs.map((tx, txIdx) => {
    const rows = tx.entries.map((e) => ({ ...e, txIdx, flatIdx: flatIdx++ }));
    return { txIdx, title: tx.title, text: tx.text, hint: tx.hint, hint2: tx.hint2, rows };
  });
  const journalFlat = journalGroups.flatMap((g) => g.rows);

  const ledgerMap = new Map();
  journalFlat.forEach((e) => {
    if (!ledgerMap.has(e.account)) ledgerMap.set(e.account, { account: e.account, debit: 0, credit: 0, touchedBy: [] });
    const rec = ledgerMap.get(e.account);
    if (e.type === 'debit') rec.debit += e.amount; else rec.credit += e.amount;
    rec.touchedBy.push(e.txIdx + 1);
  });
  const ledgerRows = Array.from(ledgerMap.values()).map((r) => ({ ...r, touchedBy: Array.from(new Set(r.touchedBy)) }));

  const trialRows = ledgerRows
    .map((r) => {
      const net = r.debit - r.credit;
      return { account: r.account, debit: net > 0 ? net : 0, credit: net < 0 ? -net : 0 };
    })
    .filter((r) => r.debit !== 0 || r.credit !== 0);

  const neracaKiri = [], neracaKanan = [], labaKiri = [], labaKanan = [];
  trialRows.forEach((r) => {
    const m = ACCOUNTS_META[r.account];
    if (!m || m.statement === 'none') return;
    const amount = r.debit || r.credit;
    const bucket = m.statement === 'neraca'
      ? (m.side === 'kiri' ? neracaKiri : neracaKanan)
      : (m.side === 'kiri' ? labaKiri : labaKanan);
    bucket.push({ account: r.account, amount, sign: m.sign });
  });

  return {
    n, txs, journalGroups, journalFlat, ledgerRows, trialRows,
    neraca: { kiri: neracaKiri, kanan: neracaKanan },
    labarugi: { kiri: labaKiri, kanan: labaKanan },
    hasNeraca: neracaKiri.length > 0 || neracaKanan.length > 0,
    hasLabarugi: labaKiri.length > 0 || labaKanan.length > 0,
  };
}

/* ============================================================================================
   SMALL SHARED HOOKS
   ============================================================================================ */

function useShake() {
  const [shake, setShake] = useState(false);
  useEffect(() => {
    if (!shake) return;
    const t = setTimeout(() => setShake(false), 500);
    return () => clearTimeout(t);
  }, [shake]);
  return [shake, () => setShake(true)];
}

function useRowInputs(expectedRows, keys) {
  const [inputs, setInputs] = useState(() => expectedRows.map(() => keys.reduce((o, k) => ({ ...o, [k]: '' }), {})));
  const setCell = (i, key, value) => setInputs((prev) => {
    const next = prev.slice();
    next[i] = { ...next[i], [key]: value };
    return next;
  });
  return [inputs, setCell];
}

function gradeRows(expectedRows, fields, inputs) {
  let ok = true;
  const errors = expectedRows.map((row, i) => {
    const rowErr = {};
    fields.forEach((f) => {
      const expected = row[f.key];
      let same;
      if (f.type === 'number') {
        const norm = (v) => (v === '' || v === null || v === undefined ? 0 : Number(v));
        same = norm(inputs[i][f.key]) === norm(expected);
      } else {
        same = String(inputs[i][f.key] || '') === String(expected || '');
      }
      rowErr[f.key] = !same;
      if (!same) ok = false;
    });
    return rowErr;
  });
  return { ok, errors };
}

                  <div className="font-semibold text-gray-700">{r.account}</div>
                  <div className="text-right font-mono text-gray-600">{r.debit ? fmtRp(r.debit) : '-'}</div>
                  <div className="text-right font-mono text-gray-600">{r.credit ? fmtRp(r.credit) : '-'}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================================================
   PHASE 1 — JURNAL UMUM
   ============================================================================================ */

function PhaseJournal({ builtLevel, hearts, setHearts, onFail, onNext, onOpenRecap }) {
  const fields = [{ key: 'account', type: 'text' }, { key: 'amount', type: 'number' }];
  const [inputs, setCell] = useRowInputs(builtLevel.journalFlat, ['account', 'amount']);
  const [errors, setErrors] = useState(() => builtLevel.journalFlat.map(() => ({ account: false, amount: false })));
  const [feedback, setFeedback] = useState(null);
  const [shake, triggerShake] = useShake();
  const [hintTier, setHintTier] = useState(-1);
  const [hintGroupIdx, setHintGroupIdx] = useState(0);

  const handleCheck = () => {
    const { ok, errors: newErrors } = gradeRows(builtLevel.journalFlat, fields, inputs);
    setErrors(newErrors);
    if (ok) {
      setFeedback('success');
    } else {
      setFeedback('error'); triggerShake();
      setHearts((h) => Math.max(0, h - 1));
      const firstBadFlatIdx = newErrors.findIndex((e) => e.account || e.amount);
      const badGroupIdx = builtLevel.journalFlat[firstBadFlatIdx]?.txIdx ?? 0;
      setHintGroupIdx(badGroupIdx);
      setHintTier((t) => Math.min(t + 1, 1));
    }
  };

  const activeGroup = builtLevel.journalGroups[hintGroupIdx];
  const hints = activeGroup ? [activeGroup.hint, activeGroup.hint2] : [];

  return (
    <div className="flex-1 overflow-y-auto flex flex-col bg-white rounded-t-3xl border-t-2 border-gray-200 shadow-inner">
      <div className="p-4 sm:p-6 max-w-4xl mx-auto w-full flex-1">
        <StageHeader
          badgeClass="bg-blue-100 text-blue-600" badgeText="TAHAP 1" title="Jurnal Umum"
          right={<button onClick={onOpenRecap} className="text-xs font-bold text-blue-500 hover:text-blue-700 flex items-center gap-1"><Eye size={14} /> Lihat semua transaksi</button>}
        />
        <p className="text-gray-600 mb-6 font-medium text-sm sm:text-base">
          Catat {builtLevel.n} transaksi di bawah ke dalam Jurnal. Tentukan akun serta sisi Debit/Kreditnya satu per satu.
        </p>

        <div className="space-y-5">
          {builtLevel.journalGroups.map((group) => {
            const groupHasError = group.rows.some((r) => errors[r.flatIdx]?.account || errors[r.flatIdx]?.amount);
            return (
              <div key={group.txIdx} className={`bg-white border-2 rounded-2xl p-3 sm:p-5 shadow-sm transition-colors ${groupHasError ? 'border-red-300' : 'border-gray-200'} ${shake && groupHasError ? 'animate-shake' : ''}`}>
                <div className="flex items-center gap-2 mb-3">
                  <div className="bg-gray-800 text-white text-xs font-extrabold w-6 h-6 rounded-full flex items-center justify-center shrink-0">{group.txIdx + 1}</div>
                  <p className="text-gray-700 font-semibold text-sm sm:text-base leading-snug">{group.text}</p>
                </div>
                <div className="grid grid-cols-12 gap-2 sm:gap-4 mb-2 text-[10px] sm:text-xs font-bold text-gray-400 uppercase tracking-wider border-b-2 border-gray-100 pb-2">
                  <div className="col-span-6 sm:col-span-5">Nama Akun</div>
                  <div className="col-span-3 sm:col-span-3 text-right">Debit (Rp)</div>
                  <div className="col-span-3 sm:col-span-4 text-right">Kredit (Rp)</div>
                </div>
                {group.rows.map((row) => (
                  <div key={row.flatIdx} className="grid grid-cols-12 gap-2 sm:gap-4 items-center mb-2">
                    <div className={`col-span-6 sm:col-span-5 ${row.type === 'credit' ? 'pl-4 sm:pl-8' : ''}`}>
                      <CustomSelect
                        value={inputs[row.flatIdx].account}
                        onChange={(val) => setCell(row.flatIdx, 'account', val)}
                        options={ACCOUNT_OPTIONS}
                        error={errors[row.flatIdx]?.account}
                        theme="blue"
                      />
                    </div>
                    <div className="col-span-3 sm:col-span-3">
                      {row.type === 'debit' ? (
                        <input type="number" placeholder="0" value={inputs[row.flatIdx].amount} onChange={(e) => setCell(row.flatIdx, 'amount', e.target.value)}
                          className={`w-full p-2 sm:p-3 bg-gray-50 border-2 rounded-xl text-right font-mono text-xs sm:text-base focus:outline-none transition-colors ${errors[row.flatIdx]?.amount ? 'border-red-500 bg-red-50 text-red-700' : 'border-gray-200 focus:border-blue-400'}`} />
                      ) : <div className="w-full p-2 sm:p-3 bg-gray-100 border-2 border-transparent rounded-xl text-center text-gray-400 font-mono">-</div>}
                    </div>
                    <div className="col-span-3 sm:col-span-4">
                      {row.type === 'credit' ? (
                        <input type="number" placeholder="0" value={inputs[row.flatIdx].amount} onChange={(e) => setCell(row.flatIdx, 'amount', e.target.value)}
                          className={`w-full p-2 sm:p-3 bg-gray-50 border-2 rounded-xl text-right font-mono text-xs sm:text-base focus:outline-none transition-colors ${errors[row.flatIdx]?.amount ? 'border-red-500 bg-red-50 text-red-700' : 'border-gray-200 focus:border-blue-400'}`} />
                      ) : <div className="w-full p-2 sm:p-3 bg-gray-100 border-2 border-transparent rounded-xl text-center text-gray-400 font-mono">-</div>}
                    </div>
                  </div>
                ))}
              </div>
            );
          })}
        </div>

        <HintBox tier={feedback === 'success' ? -1 : hintTier} hints={hints} onMore={() => setHintTier(1)} />
      </div>
      <GameFooter feedback={feedback} onCheck={handleCheck} onNext={onNext} hearts={hearts} onFail={onFail} />
    </div>
  );
}

/* ============================================================================================
   SHARED T-ACCOUNT TABLE — used by both Buku Besar and Neraca Saldo (same shape: account label
   + a Debit input + a Kredit input).
   ============================================================================================ */

const T_ACCOUNT_THEMES = {
  purple: { header: 'bg-purple-50 text-purple-900', focus: 'border-gray-200 focus:border-purple-400' },
  orange: { header: 'bg-orange-50 text-orange-900', focus: 'border-gray-200 focus:border-orange-400' },
};

function TAccountGrid({ rows, inputs, setCell, errors, theme, layout }) {
  if (layout === 'grid2') {
    const t = T_ACCOUNT_THEMES[theme] || T_ACCOUNT_THEMES.purple;
    return (
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
        {rows.map((acc, i) => (
          <div key={i} className="bg-white border-2 border-gray-200 rounded-xl overflow-hidden shadow-sm">
            <div className={`${t.header} py-3 px-4 text-center font-extrabold border-b-2 border-gray-200 text-sm sm:text-base`}>
              T-Account: {acc.account.toUpperCase()}
            </div>
            <div className="flex">
              <div className="w-1/2 p-3 sm:p-4 border-r-2 border-gray-200 bg-gray-50/50">
                <div className="text-[10px] sm:text-xs font-bold text-gray-400 text-center mb-2">DEBIT (KIRI)</div>
                <input type="number" placeholder="0" value={inputs[i].debit} onChange={(e) => setCell(i, 'debit', e.target.value)}
                  className={`w-full p-2 bg-white border-2 rounded-lg text-right font-mono text-sm sm:text-base focus:outline-none transition-colors ${errors[i]?.debit ? 'border-red-500 bg-red-50 text-red-700' : t.focus}`} />
              </div>
              <div className="w-1/2 p-3 sm:p-4 bg-gray-50/50">

                <input type="number" placeholder="0" value={inputs[i].credit} onChange={(e) => setCell(i, 'credit', e.target.value)}
                  className={`w-full p-2 bg-white border-2 rounded-lg text-right font-mono text-sm sm:text-base focus:outline-none transition-colors ${errors[i]?.credit ? 'border-red-500 bg-red-50 text-red-700' : t.focus}`} />
              </div>
            </div>
          </div>
        ))}
      </div>
    );
  }
  // layout === 'table'
  const totalDebit = rows.reduce((s, _, i) => s + (Number(inputs[i].debit) || 0), 0);
  const totalCredit = rows.reduce((s, _, i) => s + (Number(inputs[i].credit) || 0), 0);
  const expectedTotalDebit = rows.reduce((s, r) => s + (Number(r.debit) || 0), 0);
  const expectedTotalCredit = rows.reduce((s, r) => s + (Number(r.credit) || 0), 0);
  return (
    <div className="bg-white border-2 border-gray-200 rounded-2xl p-3 sm:p-5 shadow-sm">
      <div className="grid grid-cols-12 gap-2 sm:gap-4 mb-3 text-[10px] sm:text-xs font-bold text-gray-400 uppercase tracking-wider border-b-2 border-gray-100 pb-2">
        <div className="col-span-6 sm:col-span-5">Nama Akun</div>
        <div className="col-span-3 sm:col-span-3 text-right">Debit (Rp)</div>
        <div className="col-span-3 sm:col-span-4 text-right">Kredit (Rp)</div>
      </div>
      {rows.map((r, i) => (
        <div key={i} className="grid grid-cols-12 gap-2 sm:gap-4 items-center mb-3">
          <div className="col-span-6 sm:col-span-5 font-bold text-gray-700 pl-2 sm:pl-4 text-sm sm:text-base">{r.account}</div>
          <div className="col-span-3 sm:col-span-3">
            <input type="number" placeholder="0" value={inputs[i].debit} onChange={(e) => setCell(i, 'debit', e.target.value)}
              className={`w-full p-2 sm:p-3 bg-gray-50 border-2 rounded-xl text-right font-mono text-sm sm:text-base focus:outline-none transition-colors ${errors[i]?.debit ? 'border-red-500 bg-red-50 text-red-700' : 'border-gray-200 focus:border-orange-400'}`} />
          </div>
          <div className="col-span-3 sm:col-span-4">
            <input type="number" placeholder="0" value={inputs[i].credit} onChange={(e) => setCell(i, 'credit', e.target.value)}
              className={`w-full p-2 sm:p-3 bg-gray-50 border-2 rounded-xl text-right font-mono text-sm sm:text-base focus:outline-none transition-colors ${errors[i]?.credit ? 'border-red-500 bg-red-50 text-red-700' : 'border-gray-200 focus:border-orange-400'}`} />
          </div>
        </div>
      ))}
      <div className="grid grid-cols-12 gap-2 sm:gap-4 items-center border-t-2 border-gray-200 pt-4 mt-2 bg-gray-50/50 rounded-b-xl -mx-3 sm:-mx-5 -mb-3 sm:-mb-5 p-3 sm:p-5">
        <div className="col-span-6 sm:col-span-5 font-extrabold text-gray-800 text-right pr-2 sm:pr-4 text-sm sm:text-base">TOTAL :</div>
        <div className={`col-span-3 sm:col-span-3 text-right font-mono text-sm sm:text-base font-bold p-2 sm:p-3 rounded-lg ${totalDebit === expectedTotalDebit && totalDebit > 0 ? 'text-green-700 bg-green-100 border-green-300 border-2' : 'text-gray-700 bg-white border-2 border-gray-200'}`}>
          {totalDebit.toLocaleString('id-ID')}

        <div className={`col-span-3 sm:col-span-4 text-right font-mono text-sm sm:text-base font-bold p-2 sm:p-3 rounded-lg ${totalCredit === expectedTotalCredit && totalCredit > 0 ? 'text-green-700 bg-green-100 border-green-300 border-2' : 'text-gray-700 bg-white border-2 border-gray-200'}`}>
          {totalCredit.toLocaleString('id-ID')}
        </div>
      </div>
    </div>
  );
}

/* ============================================================================================
   PHASE 2 — BUKU BESAR (POSTING)
   ============================================================================================ */

function PhaseLedger({ builtLevel, hearts, setHearts, onNext, onFail, onOpenRecap }) {
  const fields = [{ key: 'debit', type: 'number' }, { key: 'credit', type: 'number' }];
  const rows = builtLevel.ledgerRows;
  const [inputs, setCell] = useRowInputs(rows, ['debit', 'credit']);
  const [errors, setErrors] = useState(() => rows.map(() => ({ debit: false, credit: false })));
  const [feedback, setFeedback] = useState(null);
  const [shake, triggerShake] = useShake();
  const [hintTier, setHintTier] = useState(-1);
  const [hintRowIdx, setHintRowIdx] = useState(0);

  const handleCheck = () => {
    const { ok, errors: newErrors } = gradeRows(rows, fields, inputs);
    setErrors(newErrors);
    if (ok) setFeedback('success');
    else {
      setFeedback('error'); triggerShake();
      setHearts((h) => Math.max(0, h - 1));
      const bad = newErrors.findIndex((e) => e.debit || e.credit);
      setHintRowIdx(bad >= 0 ? bad : 0);
      setHintTier((t) => Math.min(t + 1, 1));
    }
  };

  const badRow = rows[hintRowIdx];
  const hints = badRow ? [
    `Akun "${badRow.account}" muncul di Transaksi ${badRow.touchedBy.join(', ')}. Jumlahkan seluruh nilai Debit dari transaksi itu untuk kolom Debit, lalu jumlahkan seluruh nilai Kreditnya untuk kolom Kredit.`,
    `Jawaban akun ini: Debit = ${fmtRp(badRow.debit)}, Kredit = ${fmtRp(badRow.credit)}.`,
  ] : [];

  return (
    <div className="flex-1 overflow-y-auto flex flex-col bg-white rounded-t-3xl border-t-2 border-gray-200 shadow-inner">
      <div className="p-4 sm:p-6 max-w-4xl mx-auto w-full flex-1">
        <StageHeader
          badgeClass="bg-purple-100 text-purple-700" badgeText="TAHAP 2" title="Posting ke Buku Besar"
          right={<button onClick={onOpenRecap} className="text-xs font-bold text-purple-600 hover:text-purple-800 flex items-center gap-1"><Eye size={14} /> Lihat Jurnal</button>}
        />
        <p className="text-gray-600 mb-6 font-medium text-sm sm:text-base">
          Jumlahkan semua Debit dan Kredit yang menyentuh setiap akun dari {builtLevel.n} transaksi di atas, lalu posting totalnya ke T-Account masing-masing.
        </p>
        <div className={shake ? 'animate-shake' : ''}>
          <TAccountGrid rows={rows} inputs={inputs} setCell={setCell} errors={errors} theme="purple" layout="grid2" />
        </div>
        <HintBox tier={feedback === 'success' ? -1 : hintTier} hints={hints} onMore={() => setHintTier(1)} />
      </div>
      <GameFooter feedback={feedback} onCheck={handleCheck} onNext={onNext} hearts={hearts} onFail={onFail} />
    </div>
  );
}

/* ============================================================================================
   PHASE 4 — LAPORAN KEUANGAN (may render Neraca and/or Laba Rugi depending on what the
   cumulative transactions actually touched)
   ============================================================================================ */

function StatementBlock({ title, badge, leftTitle, rightTitle, leftRows, rightRows, leftInputs, setLeftCell, rightInputs, setRightCell, leftErrors, rightErrors, showNetRow }) {
  // Totals are SIGNED: contra accounts (Prive, Akumulasi Penyusutan, Retur/Potongan ...) carry
  // sign -1 on their own row and must subtract from the column total, not add to it.
  const totalLeft = leftRows.reduce((s, r, i) => s + (Number(leftInputs[i].amount) || 0) * r.sign, 0);
  const totalRight = rightRows.reduce((s, r, i) => s + (Number(rightInputs[i].amount) || 0) * r.sign, 0);
  const expectedLeft = leftRows.reduce((s, r) => s + (Number(r.amount) || 0) * r.sign, 0);
  const expectedRight = rightRows.reduce((s, r) => s + (Number(r.amount) || 0) * r.sign, 0);
  const leftFilled = leftInputs.some((c) => c.amount !== '');
  const rightFilled = rightInputs.some((c) => c.amount !== '');
  const leftMatched = leftFilled && totalLeft === expectedLeft;
  const rightMatched = rightFilled && totalRight === expectedRight;
  return (
    <div className="mb-8">
      <div className="flex items-center gap-2 mb-3">
        <span className="text-xs font-extrabold text-pink-600 bg-pink-100 px-2 py-1 rounded">{badge}</span>
        <h3 className="font-extrabold text-gray-800 text-lg">{title}</h3>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div className="bg-white border-2 border-gray-200 rounded-2xl p-4 sm:p-5 shadow-sm">
          <h4 className="text-sm sm:text-base font-extrabold text-gray-800 border-b-2 border-gray-100 pb-3 mb-4">{leftTitle}</h4>
          <div className="space-y-4">
            {leftRows.map((row, i) => (
              <div key={i} className="flex flex-col gap-2">
                <CustomSelect value={leftInputs[i].account} onChange={(v) => setLeftCell(i, 'account', v)} options={ACCOUNT_OPTIONS} error={leftErrors[i]?.account} theme="blue" />
                <div className="relative">
                  <span className="absolute left-3 top-2.5 sm:top-3 text-gray-400 font-bold text-sm sm:text-base">Rp</span>
                  <input type="number" placeholder="0" value={leftInputs[i].amount} onChange={(e) => setLeftCell(i, 'amount', e.target.value)}
                    className={`w-full p-2 sm:p-3 pl-10 sm:pl-12 bg-gray-50 border-2 rounded-xl text-right font-mono text-sm sm:text-base focus:outline-none transition-colors ${leftErrors[i]?.amount ? 'border-red-500 bg-red-50 text-red-700' : 'border-gray-200 focus:border-blue-400'}`} />
                </div>
              </div>
            ))}
          </div>
          <div className={`mt-6 pt-4 border-t-2 border-gray-200 flex justify-between font-extrabold text-sm sm:text-base rounded-b-lg ${leftMatched ? 'text-green-700' : 'text-gray-800'}`}>
            <span>Total:</span><span className="font-mono">{fmtRp(totalLeft)}</span>
          </div>
        </div>
        <div className="bg-white border-2 border-gray-200 rounded-2xl p-4 sm:p-5 shadow-sm">
          <h4 className="text-sm sm:text-base font-extrabold text-gray-800 border-b-2 border-gray-100 pb-3 mb-4">{rightTitle}</h4>
          <div className="space-y-4">
            {rightRows.map((row, i) => (
              <div key={i} className="flex flex-col gap-2">
                <CustomSelect value={rightInputs[i].account} onChange={(v) => setRightCell(i, 'account', v)} options={ACCOUNT_OPTIONS} error={rightErrors[i]?.account} theme="pink" />
                <div className="relative">
                  <span className="absolute left-3 top-2.5 sm:top-3 text-gray-400 font-bold text-sm sm:text-base">Rp</span>
                  <input type="number" placeholder="0" value={rightInputs[i].amount} onChange={(e) => setRightCell(i, 'amount', e.target.value)}
                    className={`w-full p-2 sm:p-3 pl-10 sm:pl-12 bg-gray-50 border-2 rounded-xl text-right font-mono text-sm sm:text-base focus:outline-none transition-colors ${rightErrors[i]?.amount ? 'border-red-500 bg-red-50 text-red-700' : 'border-gray-200 focus:border-pink-400'}`} />
                </div>
              </div>
            ))}
          </div>
          <div className={`mt-6 pt-4 border-t-2 border-gray-200 flex justify-between font-extrabold text-sm sm:text-base ${rightMatched ? 'text-green-700' : 'text-gray-800'}`}>
            <span>Total:</span><span className="font-mono">{fmtRp(totalRight)}</span>
          </div>
        </div>
      </div>
      {showNetRow && (
        <div className="mt-6 p-4 sm:p-5 rounded-xl bg-green-50 border-2 border-green-300 flex flex-col sm:flex-row justify-between items-center text-green-900 font-extrabold text-base sm:text-lg gap-2 shadow-sm">
          <span>LABA / RUGI BERSIH (Pendapatan − Beban):</span>
          <span className="font-mono bg-white px-4 py-1 rounded-lg border-2 border-green-200">{fmtRp(totalLeft - totalRight)}</span>
        </div>
      )}
    </div>
  );
}

  const [lKananErr, setLKananErr] = useState(() => labarugi.kanan.map(() => ({})));

  const [feedback, setFeedback] = useState(null);
  const [shake, triggerShake] = useShake();
  const [hintTier, setHintTier] = useState(-1);
  const [hintAccount, setHintAccount] = useState(null);

  const handleCheck = () => {
    const rN1 = gradeRows(neraca.kiri, fields, nKiriIn);
    const rN2 = gradeRows(neraca.kanan, fields, nKananIn);
    const rL1 = gradeRows(labarugi.kiri, fields, lKiriIn);
    const rL2 = gradeRows(labarugi.kanan, fields, lKananIn);
    setNKiriErr(rN1.errors); setNKananErr(rN2.errors); setLKiriErr(rL1.errors); setLKananErr(rL2.errors);
    const ok = rN1.ok && rN2.ok && rL1.ok && rL2.ok;
    if (ok) {
      setFeedback('success');
    } else {
      setFeedback('error'); triggerShake();
      setHearts((h) => Math.max(0, h - 1));
      const sections = [
        { rows: neraca.kiri, errs: rN1.errors }, { rows: neraca.kanan, errs: rN2.errors },
        { rows: labarugi.kiri, errs: rL1.errors }, { rows: labarugi.kanan, errs: rL2.errors },
      ];
      let picked = null;
      for (const sec of sections) {
        const badIdx = sec.errs.findIndex((e) => e.account || e.amount);
        if (badIdx >= 0) { picked = sec.rows[badIdx].account; break; }
      }
      setHintAccount(picked);
      setHintTier((t) => Math.min(t + 1, 1));
    }
  };

  const explain = hintAccount ? explainAccount(hintAccount) : null;
  const hints = explain ? [explain.soft, explain.explicit] : [];

  return (
    <div className="flex-1 overflow-y-auto flex flex-col bg-white rounded-t-3xl border-t-2 border-gray-200 shadow-inner">
      <div className="p-4 sm:p-6 max-w-4xl mx-auto w-full flex-1">
        <StageHeader
          badgeClass="bg-pink-100 text-pink-700" badgeText="TAHAP 4" title="Laporan Keuangan"
          right={<button onClick={onOpenRecap} className="text-xs font-bold text-pink-600 hover:text-pink-800 flex items-center gap-1"><Eye size={14} /> Lihat Neraca Saldo</button>}
        />
        <p className="text-gray-600 mb-6 font-medium text-sm sm:text-base">
          Susun hasil akhir dari {builtLevel.n} transaksi ini menjadi laporan keuangan. Ambil setiap angka dari Neraca Saldo.
        </p>
        <div className={shake ? 'animate-shake' : ''}>
          {hasNeraca && (
            <StatementBlock
              title="Neraca" badge="POSISI KEUANGAN"
              leftTitle="ASET" rightTitle="LIABILITAS & EKUITAS"
              leftRows={neraca.kiri} rightRows={neraca.kanan}
              leftInputs={nKiriIn} setLeftCell={setNKiriCell} rightInputs={nKananIn} setRightCell={setNKananCell}
              leftErrors={nKiriErr} rightErrors={nKananErr}
              showNetRow={false}
            />
          )}
          {hasLabarugi && (
            <StatementBlock
              title="Laba Rugi" badge="HASIL USAHA"
              leftTitle="PENDAPATAN" rightTitle="BEBAN & HARGA POKOK"
              leftRows={labarugi.kiri} rightRows={labarugi.kanan}
              leftInputs={lKiriIn} setLeftCell={setLKiriCell} rightInputs={lKananIn} setRightCell={setLKananCell}
              leftErrors={lKiriErr} rightErrors={lKananErr}
              showNetRow={true}
            />
          )}
        </div>
        <HintBox tier={feedback === 'success' ? -1 : hintTier} hints={hints} onMore={() => setHintTier(1)} />
      </div>
      <GameFooter feedback={feedback} onCheck={handleCheck} onNext={onNext} hearts={hearts} onFail={onFail} />
    </div>
  );
}

    return () => clearInterval(timer);
  }, []);

  const categoryMeta = CATEGORY_META.find((c) => c.id === selectedCategory);

  // Safety net: if a screen that requires a chosen company is reached without one
  // (shouldn't happen through normal navigation), bounce back to category selection.
  useEffect(() => {
    const needsCategory = ['level', 'journal', 'ledger', 'trialBalance', 'finStat'].includes(screen);
    if (needsCategory && !categoryMeta) setScreen('category');
  }, [screen, categoryMeta]);

  const builtLevel = useMemo(() => {
    if (!categoryMeta) return null;
    if (isExamMode) return buildLevel(categoryMeta.examBank, categoryMeta.examBank.length);
    if (!activeLevelNumber) return null;
    return buildLevel(categoryMeta.bank, activeLevelNumber);
  }, [categoryMeta, activeLevelNumber, isExamMode]);

  const activeLevelId = categoryMeta ? (isExamMode ? `${categoryMeta.id}-exam` : `${categoryMeta.id}-${activeLevelNumber}`) : null;

  const goToLevelMap = () => { setIsExamMode(false); setScreen('level'); };

  const playLevel = (n) => {
    setIsExamMode(false);
    setActiveLevelNumber(n);
    setProgress(0);
    setHearts(heartsForLevel(n));
    setScreen('journal');
  };

  const playExam = () => {
    setIsExamMode(true);
    setActiveLevelNumber(null);
    setProgress(0);
    setHearts(EXAM_HEARTS);
    setScreen('journal');
  };

  const handleFail = () => {
    if (isExamMode) {
      setExamCooldowns((prev) => ({ ...prev, [categoryMeta.id]: Date.now() + EXAM_COOLDOWN_MS }));
      setScreen('examFailed');
    } else {
      setScreen('level');
    }
  };

  const advancePhase = (nextProgress, nextScreen) => { setProgress(nextProgress); setRecapOpen(false); setScreen(nextScreen); };

  const finishLevel = () => {
    setProgress(100);
    setCompletedLevels((prev) => ({ ...prev, [activeLevelId]: true }));
    setRecapOpen(false);
    setScreen('success');
  };

  if (screen === 'intro') {
    return <IntroScreen onStart={() => setScreen('onboarding')} />;
  }

  if (screen === 'onboarding') {
    return <OnboardingScreen onBack={() => setScreen('intro')} onContinue={() => setScreen('category')} />;
  }

  if (screen === 'category') {
    return <CategoryScreen onBack={() => setScreen('onboarding')} onSelect={(id) => { setSelectedCategory(id); setScreen('level'); }} />;
  }

  if (screen === 'level') {
    if (!categoryMeta) return null;
    const cooldownEnd = examCooldowns[categoryMeta.id] || 0;
    return (
      <LevelMapScreen
        categoryMeta={categoryMeta}
        completedLevels={completedLevels}
        examCooldownEnd={cooldownEnd}
        currentTime={currentTime}
        onBack={() => setScreen('category')}
        onPlayLevel={playLevel}
        onPlayExam={playExam}
      />
    );
  }

  if (screen === 'examFailed') {
    return (
      <div className="min-h-screen bg-red-500 flex flex-col items-center justify-center p-6 animate-in zoom-in duration-500">
        <div className="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-md w-full border-4 border-red-600">
          <div className="mx-auto w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mb-6 animate-bounce">
            <ShieldAlert size={64} className="text-red-500" />
          </div>
          <h1 className="text-3xl font-extrabold text-gray-800 mb-2">UJIAN GAGAL!</h1>
          <p className="text-gray-600 mb-8 text-lg font-medium">
            Pengetahuan akuntansimu belum cukup kuat untuk menaklukkan ujian ini. Ujian ini terkunci selama <strong>3 menit</strong>. Pelajari lagi materinya, lalu coba lagi!
          </p>
          <Button onClick={goToLevelMap} variant="outline">KEMBALI KE PETA LEVEL</Button>
        </div>
      </div>
    );
  }

  if (screen === 'success') {
    return (
      <div className={`min-h-screen ${isExamMode ? 'bg-yellow-500' : 'bg-green-500'} flex flex-col items-center justify-center p-6 animate-in zoom-in duration-500`}>
        <div className="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-md w-full">
          <div className={`mx-auto w-24 h-24 ${isExamMode ? 'bg-yellow-100' : 'bg-green-100'} rounded-full flex items-center justify-center mb-6`}>
            {isExamMode ? <Award size={64} className="text-yellow-500" /> : <CheckCircle2 size={64} className="text-green-500" />}
          </div>
          <h1 className="text-3xl font-extrabold text-gray-800 mb-2">{isExamMode ? 'Ujian Lulus!' : 'Luar Biasa!'}</h1>
          <p className="text-gray-600 mb-8 text-lg font-medium">
            {isExamMode
              ? `Kamu resmi menaklukkan siklus akuntansi ${categoryMeta?.title}! Dari Jurnal Umum sampai Laporan Keuangan, semua benar.`
              : `Kamu berhasil menyelesaikan satu siklus penuh untuk kasus ini. Kamu berbakat jadi Akuntan!`}
          </p>
          <Button onClick={goToLevelMap} variant="primary">KEMBALI KE PETA LEVEL</Button>
        </div>
      </div>
    );
  }

  if (!categoryMeta || !builtLevel) return null;

  const phaseIdx = PHASE_ORDER.indexOf(screen);
  const levelLabel = isExamMode ? `Ujian Akhir — ${categoryMeta.title}` : `Level ${activeLevelNumber} — ${categoryMeta.title}`;

  return (
    <div className="min-h-screen bg-gray-50 flex flex-col h-screen overflow-hidden">
      <div className="pt-5 px-6 pb-1 max-w-4xl mx-auto w-full shrink-0 bg-gray-50 z-10">
        <div className="flex items-center justify-between text-xs font-bold text-gray-400 mb-1.5">
          <span>{levelLabel}</span>
          <span>{builtLevel.n} transaksi</span>
        </div>
        <div className="flex items-center gap-6">
          <div className="flex-1 bg-gray-200 rounded-full h-4 relative overflow-hidden">
            <div className="bg-green-500 h-full rounded-full transition-all duration-500 ease-out" style={{ width: `${progress}%` }} />
          </div>
          <div className="flex items-center text-red-500 font-extrabold text-xl">
            <Heart fill="currentColor" className="mr-1.5" size={22} /> {hearts}
          </div>
        </div>
      </div>

      {phaseIdx >= 0 && (
        <div className="px-4 sm:px-6 pt-3 pb-2 max-w-4xl mx-auto w-full shrink-0 z-10 bg-gray-50">
          <div className="bg-blue-50 border-2 border-blue-200 p-3 md:p-4 rounded-2xl flex gap-3 shadow-sm items-center">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=AccoMaster" alt="Mascot" className="w-10 h-10 bg-white rounded-full border-2 border-blue-200 p-1 hidden sm:block shrink-0" />
            {phaseIdx === 0 ? (
              <p className="text-gray-800 text-sm sm:text-base font-semibold leading-relaxed">
                Kamu akan mencatat <strong>{builtLevel.n} transaksi</strong> di bawah ini. Kerjakan satu per satu, lalu cek jawabanmu.
              </p>
            ) : (
              <p className="text-gray-800 text-sm sm:text-base font-semibold leading-relaxed">
                Masih berdasarkan {builtLevel.n} transaksi yang sama. Lupa isinya? Buka rekap di kanan atas tahap ini.
              </p>
            )}
          </div>
        </div>
      )}

      {screen === 'journal' && (
        <PhaseJournal builtLevel={builtLevel} hearts={hearts} setHearts={setHearts} onFail={handleFail}
          onNext={() => advancePhase(25, 'ledger')} onOpenRecap={() => setRecapOpen(true)} />
      )}
      {screen === 'ledger' && (
        <PhaseLedger builtLevel={builtLevel} hearts={hearts} setHearts={setHearts} onFail={handleFail}
          onNext={() => advancePhase(50, 'trialBalance')} onOpenRecap={() => setRecapOpen(true)} />
      )}
      {screen === 'trialBalance' && (
        <PhaseTrialBalance builtLevel={builtLevel} hearts={hearts} setHearts={setHearts} onFail={handleFail}
          onNext={() => advancePhase(75, 'finStat')} onOpenRecap={() => setRecapOpen(true)} />
      )}
      {screen === 'finStat' && (
        <PhaseFinancialStatement builtLevel={builtLevel} hearts={hearts} setHearts={setHearts} onFail={handleFail}
          onNext={finishLevel} onOpenRecap={() => setRecapOpen(true)} />
      )}

      <RecapPanel open={recapOpen} onClose={() => setRecapOpen(false)} builtLevel={builtLevel} phase={screen} />

      <style>{`
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-5px); }
          50% { transform: translateX(5px); }
          75% { transform: translateX(-5px); }
        }
        .animate-shake { animation: shake 0.5s ease-in-out; }

        @keyframes acco-float-kf {
          0%, 100% { transform: translateY(0) rotate(0deg); }
          50% { transform: translateY(-18px) rotate(8deg); }
        }
        .acco-float { animation: acco-float-kf 4.5s ease-in-out infinite; }

        @keyframes acco-bounce-in-kf {
          0% { transform: scale(0.4) rotate(-8deg); opacity: 0; }
          60% { transform: scale(1.08) rotate(-3deg); opacity: 1; }
          100% { transform: scale(1) rotate(-3deg); opacity: 1; }
        }
        .acco-bounce-in { animation: acco-bounce-in-kf 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

        @keyframes acco-fade-up-kf {
          0% { transform: translateY(14px); opacity: 0; }
          100% { transform: translateY(0); opacity: 1; }
        }
        .acco-fade-up { animation: acco-fade-up-kf 0.6s ease-out both; }

        @keyframes acco-blob-kf {
          0%, 100% { transform: translate(0, 0) scale(1); }
          33% { transform: translate(30px, -20px) scale(1.08); }
          66% { transform: translate(-20px, 15px) scale(0.95); }
        }
        .acco-blob { position: absolute; border-radius: 9999px; filter: blur(50px); opacity: 0.45; animation: acco-blob-kf 12s ease-in-out infinite; pointer-events: none; }
        .acco-blob-1 { width: 280px; height: 280px; background: #86efac; top: -60px; left: -60px; }
        .acco-blob-2 { width: 320px; height: 320px; background: #93c5fd; bottom: -80px; right: -80px; animation-delay: -4s; }
        .acco-blob-3 { width: 220px; height: 220px; background: #fde68a; top: 40%; right: 10%; animation-delay: -8s; }

        @keyframes acco-glow-kf {
          0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.45); }
          50% { box-shadow: 0 0 0 14px rgba(34, 197, 94, 0); }
        }
        .acco-glow-btn { animation: acco-glow-kf 2.2s ease-out infinite; }
      `}</style>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Accolingo />);
</script>
</body>
</html>
